- id: mined_slab_bac5259c_v1
  title: The Statement of Recognition
  canonical_text: The second beat features a gravel voice, delivered with a calm and
    non-dramatic tone. The character delivers the line, "We thought growing family
    was all that mattered." This statement is followed by a significant pause, culminating
    in a slight, knowing laugh from the audience, suggesting a shared, ironic recognition
    of the statement's premise.
