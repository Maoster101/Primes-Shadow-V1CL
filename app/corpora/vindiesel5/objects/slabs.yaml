- id: mined_slab_0ff89414_v1
  title: 'Redefining Family: Support in Darkness'
  canonical_text: 'The conversation shifts to a profound redefinition of family, beginning
    with the statement that ''Family ain’t who you stack on top of the fire.'' This
    is immediately followed by the clarifying beat: ''It’s who you leave room for
    when the light starts runnin’ out.'' The emotional staging is noted as having
    no swelling score, relying instead on pure sincerity to deliver this final, critical
    message.'
