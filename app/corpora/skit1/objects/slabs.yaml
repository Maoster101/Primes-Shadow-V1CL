- id: mined_slab_a348793c_v1
  title: Thesis - Graph of Graphs
  canonical_text: The thesis posits that human moral intuition is a graph of graphs,
    constructed from experience and weighted by emotion. This system is updated through
    consequences and validated through relationships. It emphasizes that moral understanding
    emerges from the contextual application of these weights over time, rather than
    the weights themselves.
