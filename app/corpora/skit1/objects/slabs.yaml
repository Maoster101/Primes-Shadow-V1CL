- id: mined_slab_f15b502a_v1
  title: Core Question - Moral Intuition
  canonical_text: 'The central question explored is how humans determine right from
    wrong: is it innate, learned, or a combination of both?  The concept investigates
    what happens when someone forgets a moral rule but retains their memories. This
    exploration suggests that moral understanding goes beyond simple rules, pointing
    towards a deeper, emotionally-grounded system of experience. The proposed model
    is a lived, weighted, emotionally grounded graph of experience.'
