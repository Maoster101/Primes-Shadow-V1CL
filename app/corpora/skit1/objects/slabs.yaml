- id: mined_slab_0a3a83ef_v1
  title: Pitch Opening & Core Question
  canonical_text: 'The pitch begins with a provocative question: ''How do you know
    right from wrong? Were you born knowing it, or is it a rule you learned? What
    if you forgot the rule but kept all your memories?'' The jacket is presented as
    a potential answer to this fundamental question, and the team is actively building
    it. The jacket''s functionality is linked to the Mirror/Samurai project, with
    the moral corpus informing the scaffold design and the jacket ensuring a proper
    fit for human users.'
