- id: mined_slab_e6e69d87_v1
  title: Method - Narrative Corpus
  canonical_text: The proposed method leverages existing narrative content, such as
    film and television, which already encodes human moral reasoning in emotionally
    weighted and contextualized forms.  This approach involves sentiment analysis,
    moral decision extraction, and consequence tracking to build a weighted moral
    graph.  Point systems will benchmark outcomes across different narrative instances,
    and a cross-cultural corpus will provide validation and identify conflicts.
