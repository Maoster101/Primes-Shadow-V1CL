- id: mined_slab_4b701d2b_v1
  title: System Architecture and Development
  canonical_text: The moral corpus informs the design of the exoskeleton (Mirror),
    while the Chimera Jacket ensures it fits humans properly. The psychtown consortium
    defines the jacket's specifications, and a coder swarm builds to those specifications,
    undergoing iterative testing until a satisfactory result is achieved, signified
    by the phrase 'hello friend'.
