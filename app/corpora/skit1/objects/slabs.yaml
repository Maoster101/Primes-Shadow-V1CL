- id: mined_slab_74e82602_v1
  title: Key Research Questions
  canonical_text: Several key questions remain to be addressed, including determining
    the minimum corpus size needed for a sufficiently dense moral graph, managing
    cultural conflicts without imposing a Western default, and assessing whether narrative
    moral reasoning translates to real-world decision-making. Furthermore, the holographic
    companion application's fidelity presents a trade-off between compute resources
    and usability.
