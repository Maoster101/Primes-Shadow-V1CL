- id: mined_slab_aa851b6b_v1
  title: 'The Reframe: Questioning Shared Purpose'
  canonical_text: 'The moment is punctuated by the stark realization: ''Didn’t stop
    to think who we were burnin’ to do it.'' This statement hangs in the silence,
    forcing an immediate, profound re-evaluation of the group''s collective identity.
    The word ''family'' itself undergoes a rapid and dramatic flip in meaning, shifting
    from a term of belonging to a source of critical questioning.'
