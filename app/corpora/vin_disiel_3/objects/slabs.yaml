- id: mined_slab_8d833d0d_v1
  title: The Moral Test of Family
  canonical_text: True family is not defined by those who are superficially stacked
    upon a crisis or danger. Instead, it is measured by the people who are given space
    and room when all other sources of light and support begin to fail. This realization
    is delivered with profound sincerity, foregoing any dramatic musical score.
