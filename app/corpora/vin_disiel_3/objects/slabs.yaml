- id: mined_slab_de4750fd_v1
  title: The Core Statement of Misplaced Priorities
  canonical_text: A gravelly, calm voice delivers the line, "We thought growing family
    was all that mattered." The statement is delivered without drama, followed by
    a significant pause that elicits a slight, knowing laugh from the audience, suggesting
    a shared, ironic recognition of the premise.
