- id: mined_slab_d52fb108_v1
  title: Moral Compression
  canonical_text: The speaker delivers a concise definition of family, contrasting
    conventional notions with a deeper understanding. They assert that family is not
    determined by shared hardship, but by the space created for others during times
    of scarcity. This sentiment is presented with a deliberate lack of musical embellishment,
    emphasizing its sincerity and emotional weight. The statement suggests a re-evaluation
    of familial bonds beyond immediate survival.
