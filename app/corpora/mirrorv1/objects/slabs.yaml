- id: mined_slab_0a03735d_v1
  title: 'Dynamic Semantic Substrate: Weighted Dependencies'
  canonical_text: The current Corpus implementation simplifies all conceptual relationships
    by treating edges as binary—a slab either supports a bundle or it does not. To
    achieve greater fidelity, the Corpus must be extended to support graded dependency
    weights on edges like SUPPORTS, INVOKES, and CONFLICTS. This enhancement enables
    dependency-weighted drift detection, allows for the prioritization of review-relevant
    nodes, and provides a meaningful distinction between structural and incidental
    relationships. Crucially, these weights are designed only to inform analysis and
    do not trigger autonomous propagation.
  links:
    anchors: []
    bundles: []
  version: v1
  type: REFERENCE
