  title: Handling Uncertainty and Knowledge Gaps
  canonical_text: The [UNKNOWN] category is particularly crucial because it validates
    'I do not know' as a complete and permissible output. This mechanism actively
    resists the helpfulness bias common in large language models, which often generate
    plausible-sounding content even when genuine knowledge is absent.
