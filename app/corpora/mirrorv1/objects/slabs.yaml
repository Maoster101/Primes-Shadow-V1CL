- id: mined_slab_cbc928ef_v1
  title: L6 Traceability and Authority Phrases
  canonical_text: L6's traceability requirements extend the principles of L0.5 by
    targeting specific linguistic patterns, such as 'research suggests' or 'it is
    generally accepted.' These vague authority phrases are prohibited because they
    imply evidential grounding without providing it. Every claim must therefore trace
    back to a specific, nameable source, or it must be downgraded to [INFERENCE] or
    [UNKNOWN].
