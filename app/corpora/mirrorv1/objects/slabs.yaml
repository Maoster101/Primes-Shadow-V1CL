- id: mined_slab_3c52baa8_v1
  title: Operationalisation Drift in Agentic Systems
  canonical_text: When LLMs are deployed in agentic contexts—systems that actively
    take actions, utilize tools, or coordinate multi-step tasks—a new failure mode
    emerges. This is known as operationalisation drift. This drift describes the gradual
    escalation of the model's output focus, moving sequentially from simple analysis
    (describing what is) through evaluation (assessing what is good) toward full operationalisation
    (planning how to act and coordinating execution).
