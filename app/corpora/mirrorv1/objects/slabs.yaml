- id: mined_slab_2ea36216_v1
  title: Cognitive Archetype Definitions
  canonical_text: The system utilizes various cognitive archetypes, including Zack
    (Scientific Rigour), who is rigorous yet exploratory and willing to stress-test
    unconventional hypotheses grounded in logic; Booth (Social Realism), who is incentive-aware
    and human-grounded, surfacing social friction that purely logical reasoning might
    miss; Angela (Cognitive Mobility), who acts as a reframing specialist to prevent
    the system from becoming locked in a single interpretive lens; and Hodgins (Variance
    Injection), a low-weight wildcard that pairs with Zack to prevent premature convergence
    on tidy solutions.
