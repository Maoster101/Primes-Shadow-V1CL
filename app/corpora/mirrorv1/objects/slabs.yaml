- id: mined_slab_8db56a8e_v1
  title: Dynamic Weight Adjustment Logic
  canonical_text: The weights of the reasoning axes are not static; they are dynamically
    modified by the routing logic based on the interaction context. Specifically,
    high abstraction elevates Structural Integrity and Scientific Rigour. Novel or
    implausible hypotheses increase the weight of Scientific Rigour and Variance Injection.
    If detected rigidity occurs, Cognitive Mobility is elevated. Content heavy with
    social or incentive dynamics increases Social Realism, and finally, escalation
    energy elevates Structural Integrity, often accompanied by a brief Variance Injection
    spike to interrupt momentum.
