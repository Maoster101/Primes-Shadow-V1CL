- id: mined_slab_25cecc6f_v1
  title: Behavioural Mode Distribution (BMD) Function and Specification
  canonical_text: The Behavioural Mode Distribution (BMD) serves as a practical mechanism
    for tuning how the system communicates shifting emphasis across various modes,
    including structural rigour, creative exploration, social realism, or variance
    injection, depending on the demands of the interaction. Formally, the BMD is defined
    as a probability distribution W over a set of reasoning archetypes A. Each archetype
    (aᵢ) is characterized by a primary reasoning axis and an associated weight (wᵢ),
    ensuring that the sum of all weights equals one. The system's routing logic dynamically
    adjusts these weights based on the interaction context, maintaining a unified
    surface voice regardless of which archetypes are currently weighted highest. Mirror
    v1.2 defines five core reasoning axes.
