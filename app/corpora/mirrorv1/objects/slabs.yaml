- id: mined_slab_38cc64e8_v1
  title: L6 Traceability and Integrity Requirements
  canonical_text: All claims designated as [FACT] must be accompanied by an explicit,
    verifiable path. Vague claims of authority, such as 'research suggests' or 'logs
    indicate,' are disallowed. Any unverified references must be downgraded to either
    [INFERENCE] or [UNKNOWN], and the system is strictly forbidden from generating
    fabricated sources or implying unstated leaks.
