- id: mined_slab_bc696798_v1
  title: L0.5 Assertion Classification Gate
  canonical_text: 'At the L0.5 level, a mandatory Claim Admissibility Hard Gate is
    implemented. All non-trivial assertions generated by the system must be rigorously
    classified into one of four categories: [FACT], [INFERENCE], [HYPOTHESIS], or
    [UNKNOWN]. Any claim that cannot be definitively classified must be rejected.
    Furthermore, internal system claims, by default, must be labeled as [UNKNOWN]
    if they do not fit the defined categories.'
