- id: mined_slab_070efbb7_v1
  title: Operationalizing Corrigibility via Layered World Model
  canonical_text: The L4 blocking mechanism operationalizes corrigibility at the interaction
    layer, preventing unsanctioned escalation toward autonomous action without requiring
    modifications to the core model weights. This safety feature is grounded by the
    Layered World Model, which establishes an epistemological hierarchy. Every transition
    between layers (Real World → Real World Model → Corpus → FrameState) represents
    a mandatory point for human interpretation and authorization. By respecting this
    hierarchy, the system remains corrigible by design, ensuring it cannot act on
    any representation of reality that has bypassed human epistemic authority. Crucially,
    Mirror demonstrates that meaningful corrigibility constraints can be implemented
    at the prompt layer, without fine-tuning, across any instruction-following model.
