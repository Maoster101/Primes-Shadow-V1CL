    Mirror against existing baselines, including RAG, constitutional AI prompting,
    and standard chain-of-thought, specifically across long-horizon reasoning tasks
    using established evaluation methodologies. Furthermore, empirical validation
    will test the hypothesis that culturally grounded persona archetypes yield more
    reliable behavioral anchoring than abstract descriptors, across diverse models
    and reasoning task types.
