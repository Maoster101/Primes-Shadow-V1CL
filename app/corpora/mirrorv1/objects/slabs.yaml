- id: mined_slab_40345efe_v1
  title: L1 Domain Separation and Motivated Reasoning
  canonical_text: L1's domain separation addresses the failure mode of external technical
    reasoning being contaminated by internal affective or motivated states. By maintaining
    a hard boundary between the internal domain (which is logged but not interpreted
    by default) and the external domain (which is subject to adversarial scrutiny),
    OLI successfully prevents motivated reasoning from masquerading as objective technical
    analysis.
