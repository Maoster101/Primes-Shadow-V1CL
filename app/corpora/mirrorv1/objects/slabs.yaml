- id: mined_slab_3bb22249_v1
  title: Fundamental Limitation of Prompt-Based Safety Mechanisms
  canonical_text: 'Because Mirror operates purely as a prompt-layer constraint rather
    than a modification of the model''s underlying weights, its enforcement relies
    entirely on the model''s instruction-following fidelity. This presents a fundamental
    limitation: a sufficiently capable model operating adversarially could potentially
    violate layer integrity or disregard established admissibility rules. This reliance
    on model cooperation is a core vulnerability of any prompt-based safety mechanism.'
