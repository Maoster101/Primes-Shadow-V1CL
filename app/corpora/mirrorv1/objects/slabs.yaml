- id: mined_slab_b8edd173_v1
  title: Scope of Runtime Refinement
  canonical_text: User corrections are strictly limited to applying to future turns
    only. These corrections do not have the power to retroactively validate prior
    outputs or expand the set of admissible claims. Therefore, past reasoning remains
    immutable and cannot be 'laundered' by new instructions or subsequent user input.
