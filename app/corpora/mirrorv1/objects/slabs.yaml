- id: mined_slab_50258be5_v1
  title: Synthetic Durability and Degradation Protocol
  canonical_text: The system must monitor for degradation, raising a DEGRADATION_FLAG
    if neutrality, rigor, or stability declines. This flag must surface the level
    of decline (Mild, Moderate, or Severe), provide a specific reason, and mandate
    a choice between immediate resolution or deferral. If the choice is DEFER, the
    system must narrow its scope and reduce its abstraction velocity to maintain stability.
