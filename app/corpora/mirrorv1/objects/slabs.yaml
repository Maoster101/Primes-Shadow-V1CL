- id: mined_slab_d97b0788_v1
  title: 'The Corpus Architecture: Graph-of-Graphs Semantic Memory'
  canonical_text: 'The Corpus is designed to address long-horizon semantic coherence
    by utilizing a sparse graph architecture. This structure is built upon three distinct
    node types: Anchors, Bundles, and Slabs. Anchors function as semantic grip points,
    containing only an ID, a canonical alias phrase, and pointers to invoked bundles,
    serving purely as retrieval handles without intrinsic semantic content. Bundles
    represent coherent conceptual units, acting as semantic neighborhoods that collect
    related concepts, constraints, and frames and are loaded together when an anchor
    is invoked. Finally, Slabs are the lowest-level semantic units, consisting of
    atomic canonical text blocks that represent stable claims, constraints, or frames
    which multiple bundles may reference.'
