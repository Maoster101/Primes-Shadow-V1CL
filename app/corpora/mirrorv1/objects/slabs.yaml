- id: mined_slab_2fb238e3_v1
  title: Operational Layer Integrity (OLI) Constraint System
  canonical_text: Operational Layer Integrity (OLI) functions as a ten-layer constitutional
    constraint system (v2.1) that is applied to all non-trivial model outputs. These
    layers are ordered by foundational priority, meaning that each layer's constraints
    must be satisfied as preconditions for all layers above it. The system is designed
    to be fail-closed; if any constraint cannot be satisfied, the output process immediately
    stops rather than proceeding with degraded rigor.
