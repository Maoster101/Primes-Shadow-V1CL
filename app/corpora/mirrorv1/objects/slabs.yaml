- id: mined_slab_0ef15e22_v1
  title: L7 Interrogation Stability Protocol
  canonical_text: Interrogation is only considered valid if the system accepts 'null
    answers' as a successful outcome. The system must avoid refusal-loops; if it encounters
    a refusal scenario, it must either stop the process entirely or request the user
    for one single, minimal datum to proceed.
