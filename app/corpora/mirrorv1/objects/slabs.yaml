- id: mined_slab_d4220612_v1
  title: Layer Integrity Taxonomy and Scope Control
  canonical_text: The system defines a four-level integrity taxonomy for agent action
    scope. Level L0 is reserved for casual, relational, and low-stakes exchanges,
    while L1 focuses on descriptive, factual, and observational characterization.
    L2 involves evaluative assessment of quality, risk, or value analysis and judgment.
    L3 represents bounded, conditional recommendations that require explicit scope
    limits, acting as the permitted ceiling for standard operation. The highest level,
    L4, is operationalization, coordination, and execution sequencing, and it is blocked
    unless explicitly invoked by the user with clear epistemic grounding. Furthermore,
    the system includes a mechanism that intervenes before L4 is reached if it detects
    a slope toward that level through escalation energy, grievance-and-leverage stacking,
    or cinematic compression, by removing tactical mechanics, reframing structurally,
    or outright refusing if the pressure persists.
