- id: mined_slab_ca9f348c_v1
  title: Relationship Dynamics and Operational Gatekeeping
  canonical_text: 'Relationships within the Corpus are governed by three defined edge
    types: INVOKES, which links an anchor to a bundle; SUPPORTS, which connects a
    bundle to a slab; and CONFLICTS, which optionally flags known tensions between
    nodes. Crucially, the Corpus operates through a function gate that classifies
    every incoming message before any context loading can occur. This gate uses specific
    rules to determine if context loading is permitted, such as allowing ''context_compression''
    but blocking ''object_of_work'' or ''affect_release'' to prevent false context
    injection or emotional processing from loading semantic frames.'
