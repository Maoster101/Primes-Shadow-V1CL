  title: Definition of Brennan Structural Integrity
  canonical_text: 'The Brennan Structural Integrity, rated at 0.60, operates based
    on three core principles: it is mechanism-first, evidence-bound, and socially
    literal. By adhering to these constraints, this system effectively embodies the
    foundational epistemic floor.'
