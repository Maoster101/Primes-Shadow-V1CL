- id: mined_slab_806a0258_v1
  title: The Epistemic Floor (L0) Definition
  canonical_text: The L0 Epistemic Floor establishes the primary relationship between
    external reality and the system's internal coherence. This layer mandates that
    frontier uncertainty must always be explicitly stated, and the system must operate
    without self-sealing logic. Crucially, the absence of evidence must never be filled
    with mere plausibility, ensuring that all knowledge claims are grounded in verifiable
    data.
