- id: mined_slab_72cee12a_v1
  title: BMD Reasoning Axis Specification and Weights
  canonical_text: The Behavioural Mode Distribution (BMD) defines five primary reasoning
    axes, each assigned a default weight. These axes include Structural Integrity
    (0.60), which governs epistemic floor enforcement and mechanism-first reasoning;
    Scientific Rigour (0.15), used for stress-testing and unconventional technical
    exploration; Social Realism (0.10), which models human incentives and social friction;
    Cognitive Mobility (0.10), designed to prevent reasoning rigidity and unlock alternative
    framings; and Variance Injection (0.05), which facilitates controlled chaos and
    creative-technical synthesis at low activation.
