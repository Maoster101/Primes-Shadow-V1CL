- id: mined_slab_e5768baa_v1
  title: Behavioural Mode Distribution (BMD) as a Shaping Scaffold
  canonical_text: A constraint system that is technically rigorous but cognitively
    exhausting to interact with will not be used consistently, meaning inconsistent
    use of a safety mechanism is functionally equivalent to no mechanism at all. Mirror
    addresses this challenge through a Behavioural Mode Distribution (BMD). BMD is
    defined as a weighted allocation across reasoning archetypes that shapes the texture,
    emphasis, and style of responses without modifying model weights or relaxing epistemic
    constraints. The BMD operates at the prompt layer, functioning as a behavioural
    shaping scaffold. Crucially, this mechanism is explicitly not a claim about the
    model's internal architecture, the existence of discrete reasoning modules, or
    any mechanistic decomposition of the underlying LLM.
