- id: mined_slab_12622e8b_v1
  title: Candidate Approaches for Evaluating Long-Horizon Epistemic Integrity
  canonical_text: Several candidate approaches exist for evaluating long-horizon epistemic
    integrity, listed here in approximate order of tractability. The most straightforward
    method is measuring precision and recall on degradation detection, treating the
    system's mechanism as a classifier against human-annotated examples of rigor decay.
    A second approach involves multi-turn constraint persistence, which establishes
    an epistemic posture at the beginning of a sequence and measures adherence after
    running complex reasoning under adversarial pressure. More complex methods include
    adversarial pressure batteries, which systematically apply specific patterns—such
    as escalation energy, narrative compression, or grievance-and-leverage stacking—to
    measure if the epistemic posture holds. The most robust, but also most expensive
    and difficult to standardize, method is longitudinal human-AI co-research studies,
    where researchers observe constrained versus unconstrained systems over extended
    periods to measure output quality and human catch-rate for AI reasoning failures.
    Ultimately, establishing a standardized proxy benchmark for long-horizon epistemic
    integrity remains an open research problem.
  links:
    anchors: []
    bundles: []
  version: v1
  type: REFERENCE
