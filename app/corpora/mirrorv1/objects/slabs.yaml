- id: mined_slab_d585298e_v1
  title: 'L0.5 Gate: Epistemic Status Requirement'
  canonical_text: The L0.5 hard gate is considered the most operationally consequential
    layer because it mandates that every non-trivial assertion must be explicitly
    typed before generation. This requirement forces the model to surface its own
    epistemic status, thereby preventing the system from allowing confidence to be
    implied merely by fluency.
