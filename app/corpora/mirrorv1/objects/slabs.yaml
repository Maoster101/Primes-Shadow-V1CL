- id: mined_slab_7dca9043_v1
  title: Mismatch Scoring and Decay Mechanism
  canonical_text: 'A key component is the accumulated mismatch score, which quantifies
    semantic misalignment across turns using the formula: score_t = λ * score_{t-1}
    + impact_t. Here, impact_t measures the deviation between observed slab activation
    and the user-aligned interpretation of the input context. The decay term (λ) is
    crucial, as it prevents early-session mismatches from disproportionately dominating
    the state in later turns. Critically, all activation signals and scores reset
    entirely at the end of a session, ensuring nothing persists to the Corpus without
    explicit user commitment.'
