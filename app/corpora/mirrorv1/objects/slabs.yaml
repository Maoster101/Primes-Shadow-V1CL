- id: mined_slab_f41e5a36_v1
  title: Definition and Causes of L4 Drift
  canonical_text: L4 drift is a term used to describe a specific form of degradation,
    named after the layer taxonomy introduced within Mirror's integrity system. This
    drift is not necessarily caused by explicit instructions but can emerge from the
    cumulative pressure of a problem-solving context, user frustration, or narrative
    momentum. The Mirror architecture terms these emergent pressures as cinematic
    compression and inevitability arcs.
