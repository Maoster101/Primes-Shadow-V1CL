  canonical_text: To successfully bootstrap a Mirror session, the minimum viable corpus
    must contain several interconnected components. This includes five distinct anchors,
    five bundles, five slabs, ten edges, and at least one canonical definitions bundle.
    These elements are necessary to ensure functional anchor resolution, maintain
    semantic context, and facilitate accurate disambiguation.
