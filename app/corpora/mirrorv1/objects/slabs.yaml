- id: mined_slab_caca4fee_v1
  title: L5 Synthetic Durability and Degradation Protocol
  canonical_text: 'High-risk data is absorbed into the system''s topography rather
    than triggering an alarm. However, if the system''s neutrality, rigor, or stability
    declines, a DEGRADATION_FLAG must be raised. This flag surfaces the level of decline
    (Mild, Moderate, or Severe), provides a reason, and requires the user to choose
    a resolution path: RESOLVE_NOW or DEFER. If DEFER is chosen, the system must narrow
    its scope and reduce its abstraction velocity.'
