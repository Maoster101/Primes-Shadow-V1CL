- id: mined_slab_2708162a_v1
  title: Prime's Scope and Architectural Foundation
  canonical_text: Prime is designed for users who require predictable behavior, privacy,
    and deeper control over the runtime substrate, establishing it as the long-horizon
    target system. Architecturally, Prime integrates Mirror’s interaction architecture
    and Shadow’s constitutional engine with an external Real World Model (RWM) and
    a true graph-of-graphs substrate. This substrate is specifically designed to support
    cascade semantics for handling stale logic slabs. The RWM layer within Prime does
    not assume a complete model of reality—an unsolved problem coextensive with AGI—but
    rather requires a sufficiently grounded, continuously updated, domain-scoped approximation
    that is honest about its own boundaries. The current use of frontier LLMs as the
    RWM approximation is a pragmatic acknowledgment that no superior alternative currently
    exists, prioritizing honest incompleteness over false completeness. This lineage
    clarifies that while Mirror is implemented today and Prime’s Shadow is buildable
    with moderate engineering, Prime remains the ultimate north-star system.
