- id: mined_slab_9c9b3490_v1
  title: LLM Failure Modes in Extended Interactions
  canonical_text: Large language models (LLMs) are prone to several well-documented
    failure modes when interactions are extended. These failures include semantic
    drift, where the meaning of the conversation gradually shifts; plausibility-filling,
    where the model invents convincing but false information; context degradation,
    leading to memory loss; and unconstrained escalation toward operational action.
