  title: Layer Integrity and Bounding Agent Action Scope
  canonical_text: Section 3.4, Layer Integrity, specifically addresses the bounding
    of agent action scope. Mirror's layer integrity system defines five distinct levels
    of output abstraction and enforces a hard boundary at the L3 level.
