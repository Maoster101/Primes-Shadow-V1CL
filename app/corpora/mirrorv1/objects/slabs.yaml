- id: mined_slab_9eb9ae71_v1
  title: L4 Operators and Lifecycle Management
  canonical_text: 'The system utilizes a three-stage lifecycle for generated information:
    Provisional, Commit, and Stabilised. Provisional signals possess zero epistemic
    authority and will never propagate to downstream reasoning processes until they
    have been explicitly committed by the user. This mechanism ensures that unverified
    claims do not influence the core logic.'
