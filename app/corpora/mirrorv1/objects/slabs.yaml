- id: mined_slab_be26f65a_v1
  title: The Layered World Model (LWM) Architecture
  canonical_text: 'The Layered World Model (LWM) defines the epistemological hierarchy
    through which meaning progresses from physical reality to active interaction context.
    This model consists of four distinct layers, each representing a progressively
    more personalized interpretation of the layer immediately above it. These layers
    are: (1) the Real World, which is physical reality, causally inaccessible, and
    unobservable directly; (2) the Real World Model (RWM), which is the best available
    empirical approximation drawn from scientific consensus and historical record;
    (3) the User World Model (Corpus), which constitutes the user''s personalized
    semantic graph of committed knowledge; and (4) the FrameState, which is the active
    subset of the Corpus loaded into the working context for a specific interaction
    turn. Crucially, every transition between these layers introduces potential ''drift''
    from the layer above, a risk that OLI''s epistemic constraints are designed to
    manage by enforcing honest representation of each layer''s relationship to its
    parent.'
