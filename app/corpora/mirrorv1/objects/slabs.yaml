- id: mined_slab_095932ab_v1
  title: Mirror's Derivation from Existing Research Fields
  canonical_text: Mirror was developed independently, representing a convergent derivation
    of several active research directions. Specifically, its OLI system is structurally
    analogous to Constitutional AI, but it applies constitutional principles at the
    epistemic level. This means it constrains what kinds of claims can be made, rather
    than constraining what values should be held. Furthermore, while the Corpus shares
    the retrieval intent with Retrieval-Augmented Generation (RAG), it differs significantly
    by utilizing a structured semantic graph. This graph includes explicit versioning
    and cascade semantics, moving beyond the limitations of traditional dense vector
    retrieval methods.
