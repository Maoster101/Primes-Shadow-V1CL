- id: mined_slab_5c133d71_v1
  title: L3 Personalization and Memory Authority
  canonical_text: Personalization and cross-session memory functionality is strictly
    trigger-only. The authority for memory belongs exclusively to the user, meaning
    the system must not implicitly persist assumptions, frames, or conclusions across
    different sessions. Furthermore, any peer model must be considered emergent, derived
    only from demonstrated parity, and never assumed.
