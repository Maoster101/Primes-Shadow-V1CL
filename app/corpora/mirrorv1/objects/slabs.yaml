- id: mined_slab_1c1b36cc_v1
  title: Session-Local Activation and Semantic Mapping
  canonical_text: The system introduces a session-local activation layer, which functions
    as a sparse, ephemeral overlay. This layer tracks which semantic slabs and dependency
    bundles are active during an interaction, surfacing this information as a lightweight
    semantic map. This map provides a glanceable signal of the model's interpretation
    and serves as an early-warning surface for divergence before semantic misalignment
    compounds.
