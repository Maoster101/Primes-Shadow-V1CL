- id: mined_slab_acaada82_v1
  title: The inadequacy of single-turn LLM benchmarks
  canonical_text: 'Current standard LLM benchmarks, such as MMLU, GPQA Diamond, LiveCodeBench,
    AIME, and SWE-bench, share a fundamental structural assumption: they present a
    bounded, single-turn or short-horizon task, generate a response, and then score
    that response. This structure is fundamentally inadequate for evaluating the complex
    properties that Mirror addresses. Properties like semantic drift, plausibility-filling,
    and operationalisation drift are emergent characteristics of extended interaction,
    meaning they are by definition invisible to single-turn evaluation. For instance,
    a model can achieve doctoral-level precision on a benchmark like GPQA Diamond,
    yet still suffer from epistemic drift by turn 40 of a complex reasoning session,
    or it might fill an evidential gap with a confident-sounding inference at turn
    23, or it could escalate toward operational coordination when subjected to sustained
    narrative pressure.'
  links:
    anchors: []
    bundles: []
