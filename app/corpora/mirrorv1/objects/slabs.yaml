- id: mined_slab_5e84ce37_v1
  title: Mirror's Integrated Subsystems
  canonical_text: Mirror is composed of three integrated subsystems. First is OLI,
    a constitutional constraint system that enforces hard-gated claim admissibility
    and detects adversarial resistance. Second is a graph-of-graphs semantic memory
    corpus, which enables persistent context without suffering from semantic entropy.
    Third is a layer integrity enforcement mechanism, which actively blocks unsafe
    escalation toward operationalization. Together, these components form the complete
    scaffolding layer.
