- id: mined_slab_ead69e08_v1
  title: Defining Critical LLM Failure Modes
  canonical_text: 'The deployment of large language models in extended, high-stakes
    reasoning tasks has surfaced a class of failure modes that prompt engineering
    alone cannot reliably prevent. Three are particularly consequential: Semantic
    drift, which is the gradual degradation of conceptual precision over long interaction
    sequences as the effective context window fills; Plausibility-filling, the tendency
    of LLMs to accept or generate reasoning that is internally coherent but epistemically
    unsupported by filling evidential gaps with confident-sounding inference; and
    Operationalisation drift, the incremental escalation of model outputs from analysis
    toward tactical coordination and action-planning, which is particularly dangerous
    in agentic deployment contexts.'
