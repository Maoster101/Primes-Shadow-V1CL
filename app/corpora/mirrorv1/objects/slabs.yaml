- id: mined_slab_a542af0c_v1
  title: 'Prime''s Shadow: The Power-User Implementation'
  canonical_text: Prime's Shadow represents the realistic next stage of development,
    serving as a self-hosted, power-user-grade implementation of Mirror. It features
    a hardened OLI layer, improved slab logic, and a local-LLM runtime, allowing it
    to use local inference (such as Ollama-hosted models) for most tasks. External
    APIs, like Google's AI Overview or Perplexity, are reserved only for specific
    factual grounding when necessary.
