- id: mined_slab_9464c26c_v1
  title: Moral Compression
  canonical_text: The speaker delivers a profound statement about the true meaning
    of family, asserting that it is not determined by those who are present during
    times of crisis. Instead, family is defined by those for whom space is created
    when resources are dwindling. This sentiment is presented with genuine sincerity,
    devoid of any dramatic musical accompaniment. The line emphasizes the importance
    of compassion and sacrifice within familial bonds.
