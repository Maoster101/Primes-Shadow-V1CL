  payload:
    intent:
    - This section details the core design philosophy of the Aquatic Sensory Pod,
      explaining its comprehensive approach to sensory stimulation.
    invariants:
    - The Aquatic Sensory Pod is designed as a complete environmental envelope, rather
      than a single, isolated feature
    - This design integrates control over multiple sensory inputs, including water
