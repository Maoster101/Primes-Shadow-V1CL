- id: tentative_slab_a9049516_v1
  title: 'Frame Dynamics: Salience Estimation and EWA Smoothing'
  canonical_text: 'Every active node on FrameState carries two per-turn salience floats:
    salience_now (this turn''s estimate) and salience_smoothed (a trailing EWA, alpha=0.30).
    Each turn, frame_manager._estimate_salience() calls the model with the user text
    plus descriptions of every currently active node and receives {node_id: score}
    back. Missing node_ids inherit prior * 0.90 (low_content_inherit) rather than
    collapsing to zero — this is the sparse-turn safety net for messages like "go
    on" or "yes". The EWA smoothing step is then applied: salience_smoothed = alpha
    * salience_now + (1-alpha) * prior_smoothed. New anchor matches seed salience_now
    at 0.6 (re_detect_salience); additional mentions within the same turn add +0.15
    (re_hit_boost) capped at 1.0. When active_nodes exceeds max_active_nodes (24),
    eviction drops the nodes with the lowest salience_smoothed. Mismatch score is
    the mean |salience_now - salience_smoothed| across active nodes and feeds pushback-slab
    activation when it exceeds mismatch_escalation (0.6).'
  links:
    anchors:
    - tentative_anchor_73d88b7b_v1
    bundles: []
  version: v1
  type: CANONICAL
  lifecycle_status: ACTIVE
  requires_oli_mode: null
