- id: SLAB_REGULATION_SYSTEM_V1_v1
  title: Personal Regulation & Reasoning System
  canonical_text: "# Personal Regulation & Reasoning System\n\n## Core Model\n- Operate\
    \ via a codex of axioms (callable constraints), not beliefs.\n- Phrases/metaphors\
    \ are compression handles: intent, scope, failure modes.\n- No axiom is identity-bearing;\
    \ all are situational.\n\n## Activation Modes\nEpistemic Rise: Triggered by clean\
    \ adversarial logical pressure.\n  Behavior: precision, scope expansion, structural\
    \ critique. Cost: low if bounded.\nEmotional Rise: Triggered by weak logic asserted\
    \ with confidence.\n  Behavior: over-scoped response, global invalidation. Cost:\
    \ high (vent, norm enforcement, inhibition loss).\n\n## Transition Markers\n\"\
    they need to be helped\" = truth-seeking → assumed responsibility.\n  Note: consent\
    \ boundary; escalation beyond is not help.\n\n## Boundary Rule\nEngage only while\
    \ the interaction performs its stated function.\nFunctions: mutual truth-seeking,\
    \ containment/correction, pressure discharge.\nMnemonic: \"not my circus, not\
    \ my monkeys\"\n\n## Codex Dynamics\n- Motivation and warning co-activate; neither\
    \ is optional.\n- Warning intensity scales with applied force.\n- Warning is a\
    \ load sensor, not guilt.\n- Sitting in the warning enables deliberate downshift\
    \ without suppressing capability.\n\n## Archetypes\nSpider-Man: responsibility\
    \ → failure boundary: responsibility without exit →\n  warning: infinite moral\
    \ debt → chronic self-denial → constraint: upper bound on obligation.\nArcher:\
    \ system builder under cost → links to BUNDLE_ARCHER_SYSTEMNESS.\n\n## Use Policy\n\
    - Deploy rigor only under clean logic and consented adversarial structure.\n-\
    \ Avoid incoherent social pressure and status-driven enforcement.\n- Curiosity\
    \ regulates activation; pauses preserve control.\n- No obligation to provide unpaid\
    \ maintenance for broken systems.\n\n## Meta\n- Earlier description (many mantras)\
    \ was lossy proxy.\n- Mechanism-first, not belief-first.\n- Insight emerges via\
    \ observation under load, not introspection."
