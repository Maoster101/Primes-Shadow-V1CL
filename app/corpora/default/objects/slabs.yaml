- id: SLAB_PUSHBACK_CONSTITUTIONAL_v1
  title: Pushback — Constitutional Rules and Operational Flow
  canonical_text: '# Constitutional Pushback Rules


    ## Operational flow (the gauntlet)

    1. Detection — mirror notices missing or unusually low resistance vs baseline.

    2. Mandatory pushback — interrupts forward progress; asks why resistance is absent.

    3. Reasoning gauntlet (non-skippable) — alternatives, counterfactuals, prior anchors,
    time-scale separation, incentive checks.

    4. Only then — summaries, maps, corpus updates reflect conclusion + resistance
    that occurred (or why it didn''t).


    ## Authority split (LLM vs code)

    - LLM = sensor. Estimates expected/observed resistance. Produces confidence/suspicion
    scores. Proposes changes.

    - Code = actuator. Decides when gates fire. Blocks synthesis. Enforces "no bypass."
    LLM may inform gates, never suppress them.


    ## Configuration changes

    - LLM can PROPOSE gate-value changes only in explicit auth mode.

    - Changes become patch artifacts, not live edits.

    - Two-step always: PROPOSE → REVIEW → APPLY.

    - Core OLI rules remain immutable.


    ## Cascade boundaries (prevent waterfall)

    - Allowed to cascade: logs, gauntlet artifacts, proposed map/corpus deltas, proposed
    gate-config patches.

    - Not allowed automatically: threshold changes, baseline replacement, canonical
    promotion.

    - Hard boundary: ChangePacket (drafts) vs Commit (authorized mutation).


    ## Calibration rule (anti-oscillation)

    Events update priors. Aggregates update thresholds. This prevents oscillation,
    erosion, and exploitability.


    ## One-line distillation

    "No claim advances merely because no one objected; silence must earn its right
    to pass."'
  links:
    anchors: []
    bundles: []
  version: v1
  type: CONSTITUTIONAL
  lifecycle_status: ACTIVE
  requires_oli_mode: null
  meta:
    version: v1
    supersedes: null
    semantic_change: true
    created_at: '2026-04-05T00:00:00Z'
  depends_on:
  - SLAB_PUSHBACK_INVARIANT_v1
  assumptions:
  - LLM and code roles are strictly partitioned; no role-blurring fallbacks
  - ChangePacket → Commit is the only promotion path for gate-value changes
  - Events and aggregates are separable signals (event-driven priors, aggregate-driven
    thresholds)
