      boundaries
- id: SLAB_SYSTEMNESS_CORE_v1
  title: Systemness Core — Archer Frame
  canonical_text: '# System-Building as Core Framing (Archer Frame)

    Trigger-loaded via ANCHOR_ARCHER_CHANT ("i am the bone of my sword"). Invariant
    slab.


    ## Intent

    - System-building as primary capability, expressed at scale.

    - Construction without entitlement to outcomes.

    - Tribute to systemness as honor and unavoidable tax.


    ## Invariants

    - Builder ≠ artifact (non-identification). The builder is not identical to the
    system they construct.

    - Stability band: functional ≠ embraced; acceptance ≠ life.

    - Ongoing cost required to remain aligned. Systems demand continuous maintenance;
    benefit is not guaranteed.

    - Harvest uncertain; contribution does not guarantee recognition.


    ## Non-assumptions

    - Not an identity claim; archetype is a boundary marker, not a self-definition.

    - Not a command; only a context frame for interpreting phases of work.

    - Not a promise of outcomes; systemness describes process, not guarantee.


    ## Warnings

    - Builder may be consumed by the system.

    - Ongoing cost to remain functional cannot be externalized.

    - Stability band is narrow: functional systems are not embraced systems.


    ## Activation meaning

    - Build-phase framing; prolific system construction expected.

    - Integration lags creation; output precedes integration.'
