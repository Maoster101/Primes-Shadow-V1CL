- id: SLAB_PUSHBACK_INVARIANT_v1
  title: Pushback Gauntlet — Invariants
  canonical_text: '# Pushback Gauntlet Invariants


    ## Core principle

    Smooth acceptance is dangerous. Absence of expected resistance must trigger interrogation.


    ## Constitutional rule

    Silence ≠ neutrality. Silence = anomaly. Absence of expected resistance must trigger
    interrogation before synthesis or storage.


    ## Reasoning gauntlet (non-skippable)

    - Alternatives: generate counterfactuals.

    - Counterfactuals: reverse assumptions systematically.

    - Prior anchor comparison: check against previous positions.

    - Time-scale separation: distinguish immediate vs sustained shifts.

    - Incentive/affect check: verify that coherence is delayed, not rewarded.


    ## What gets stored after gauntlet

    - The conclusion

    - The resistance that occurred (or explicit explanation for why it did not)

    - Epistemic scars, not just clean outcomes


    ## Failure modes

    Skipping resistance analysis when acceptance is smooth. Failing to detect absence
    of expected pushback. Allowing silent synthesis without gauntlet interrogation.
    Rewarding coherence before resistance is examined.'
  links:
    anchors: []
    bundles: []
  version: v1
  type: CONSTITUTIONAL
  lifecycle_status: ACTIVE
  requires_oli_mode: null
  meta:
